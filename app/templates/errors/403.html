{% extends "base.html" %}

{% block title %}Acceso Denegado - {{ brand_app_name }}{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center px-4">
    <div class="mb-8 relative">
        <span class="text-[120px] font-black text-gray-100 leading-none">403</span>
        <span
            class="i-heroicons-lock-closed text-6xl text-warning absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></span>
    </div>
    <h1 class="text-3xl font-black text-gray-900 mb-2">Acceso Denegado</h1>
    <p class="text-gray-500 mb-8 max-w-md">No tienes los permisos necesarios para acceder a este recurso.</p>
    <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}"
        class="btn-primary">
        Volver al Inicio
    </a>
</div>
{% endblock %}
