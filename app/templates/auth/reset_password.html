{% extends "base.html" %}

{% block title %}Nueva Contraseña - {{ brand_app_name }}{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <div class="card shadow-sm rounded-2xl p-8">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-gray-900 mb-2">Nueva Contraseña</h2>
                <p class="text-gray-500">Define una nueva contraseña para tu cuenta</p>
            </div>

            <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="space-y-4">
                <div>
                    <label for="new_password" class="block text-sm font-medium text-gray-700 mb-1">Nueva contraseña</label>
                    <input type="password" id="new_password" name="new_password" class="input w-full" required minlength="8" autofocus>
                    <p class="text-xs text-gray-400 mt-1">Mínimo 8 caracteres.</p>
                </div>

                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1">Confirmar contraseña</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="input w-full" required minlength="8">
                </div>

                <div class="pt-4">
                    <button type="submit" class="btn-primary w-full py-2.5">Actualizar Contraseña</button>
                </div>
            </form>

            <div class="mt-8 text-center text-sm text-gray-600">
                <a href="{{ url_for('auth.login') }}" class="text-primary hover:text-primary-dark font-semibold">Volver a Iniciar Sesión</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
