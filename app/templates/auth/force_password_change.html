{% extends "base.html" %}

{% block title %}Cambio Obligatorio de Contraseña - {{ brand_app_name }}{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <div class="card shadow-sm rounded-2xl p-8">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-gray-900 mb-2">Actualiza tu contraseña</h2>
                <p class="text-gray-500 text-sm">
                    Estás actualizando la contraseña de tu cuenta en
                    <strong>{{ current_user.company.name }}</strong>.
                </p>
            </div>

            <form method="POST" class="space-y-4">
                <div>
                    <label for="current_password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña temporal</label>
                    <input type="password" id="current_password" name="current_password" class="input w-full" required autofocus>
                </div>

                <div>
                    <label for="new_password" class="block text-sm font-medium text-gray-700 mb-1">Nueva contraseña</label>
                    <input type="password" id="new_password" name="new_password" class="input w-full" required>
                </div>

                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1">Confirmar contraseña</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="input w-full" required>
                </div>

                <button type="submit" class="btn-primary w-full py-2.5 mt-2">Guardar nueva contraseña</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
