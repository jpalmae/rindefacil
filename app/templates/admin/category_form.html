{% extends "base.html" %}

{% block title %}{% if category %}Editar Categoría{% else %}Nueva Categoría{% endif %} - {{ brand_app_name }} Admin{% endblock %}

{% block content %}
<div class="py-6 max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="mb-6">
        <a href="{{ url_for('admin.categories') }}" class="text-sm text-gray-500 hover:text-primary">← Volver a Categorías</a>
        <h1 class="text-2xl font-bold text-gray-900 mt-2">{% if category %}Editar Categoría{% else %}Nueva Categoría{% endif %}</h1>
    </div>

    <div class="card">
        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                <input type="text" name="name" class="input" value="{{ category.name if category else '' }}"
                    placeholder="Ej. Alimentación" required maxlength="100">
            </div>
            <div class="grid gap-4 sm:grid-cols-2">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Ícono (clase CSS, opcional)</label>
                    <input type="text" name="icon" class="input" value="{{ category.icon if category and category.icon else '' }}"
                        placeholder="i-heroicons-cake">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Código contable (opcional)</label>
                    <input type="text" name="account_code" class="input" value="{{ category.account_code if category and category.account_code else '' }}"
                        placeholder="Ej. 510100" maxlength="20">
                </div>
            </div>
            <div class="pt-4 border-t border-gray-200 flex justify-end gap-3">
                <a href="{{ url_for('admin.categories') }}" class="btn-outline">Cancelar</a>
                <button type="submit" class="btn-primary">{% if category %}Guardar cambios{% else %}Crear categoría{% endif %}</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
